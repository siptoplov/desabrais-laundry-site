<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Формы</title></head>
<body>
<!-- Каркас для Netlify Forms: сюда уходят все заявки сайта (см. src/lib/forms.ts). Не удалять. -->
<form name="zayavka" method="POST" data-netlify="true" netlify-honeypot="_hp" hidden>
  <input type="hidden" name="form-name" value="zayavka">
  <input type="hidden" name="subject" value="Осьминог: заявка с сайта">
  <input name="name" type="text">
  <input name="kind" type="text">
  <input name="email" type="email">
  <input name="phone" type="tel">
  <textarea name="details"></textarea>
  <input name="page" type="text">
  <input name="_hp" type="text">
</form>
</body>
</html>
