[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Адрес сайта для canonical, sitemap и соцсетей. Подключите свой домен — поменяйте здесь.
  NEXT_PUBLIC_SITE_URL = "https://osminog-fight.netlify.app"

# Старые и типовые адреса — на актуальные страницы
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
